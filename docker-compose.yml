version: '3.9'
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql://ato_user:ato_password@db:5432/ato_detection
      - SECRET_KEY=${SECRET_KEY:-changeme_in_production}
      - APP_ENV=development
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/models:/app/models
      - ./ml-data:/app/ml-data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ato_user
      POSTGRES_PASSWORD: ato_password
      POSTGRES_DB: ato_detection
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ato_user -d ato_detection"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
